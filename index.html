<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./stylesheet.css">
</head>
<body>
    <div class="card">
        <div class="card-image-box">
            <img src="./nail.jpg" alt="" class="card-image">
        </div>
        <div class="bow">୨୧</div>
        <h2 class="card-title">Nail Studio</h2>
        <p class="card-name">Nail Artist</p>
        <div class="line"></div>
        <div class="card-contact-box">
            <div class="card-icon-info">
                <i class="fa fa-duotone fa-thin fa-phone"></i>
                <p>+98 912 345 6789</p>
            </div>
            <div class="card-icon-info">
                <i class="fa fa-brands fa-instagram"></i>
                <p>@nails_studio_</p>
            </div>
            <div class="card-icon-info">
                <i class="fa fa-duotone fa-light fa-location-dot"></i>
                <p>Tabriz, Iran</p>
            </div>
        </div>
        <div class="card-thanks-box">
            <p>Pretty nails, happy you</p>
            <i class="fa fa-jelly-fill fa-regular fa-heart"></i>
        </div>
    </div>
</body>
</html>
